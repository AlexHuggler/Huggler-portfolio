name: Site CI

# Pull-request gate for the portfolio site. deploy.yml only builds on push to
# main, so without this a broken site change is first discovered after merge.

on:
  pull_request:
    paths:
      - "portfolio-site/**"
      - ".github/workflows/site-ci.yml"
  push:
    branches-ignore: [main]
    paths:
      - "portfolio-site/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - run: npm ci
      - name: Type-check (astro check)
        run: npm run check
      - name: Build
        run: npm run build
